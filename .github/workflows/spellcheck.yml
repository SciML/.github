name: "Reusable Spell Check Workflow"

on:
  workflow_call:

jobs:
  typos-check:
    name: "Spell Check with Typos"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Actions Repository"
        uses: actions/checkout@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: "Install typos"
        id: install
        shell: bash
        run: |
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import urllib.request
          import venv

          MAJOR = 1

          def latest_release(files, major):
              stable = re.compile(rf"{major}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
              prerelease = re.compile(rf"{major}\.[0-9]+\.[0-9]+(?:(?:a|b|rc)[0-9]+(?:\.dev[0-9]+)?|\.dev[0-9]+)")
              candidates = []
              for entry in files:
                  if entry.get("yanked", False) is not False:
                      continue
                  name = entry["filename"]
                  if not name.startswith("typos-"):
                      raise ValueError(f"Unsupported typos distribution: {name}")
                  declared_major = re.match(r"typos-([0-9]+)(?=[.\-])", name)
                  if declared_major is None:
                      raise ValueError(f"Unsupported typos distribution: {name}")
                  if int(declared_major[1]) != major:
                      continue
                  if name.endswith(".whl"):
                      parts = name.removesuffix(".whl").split("-")
                      if len(parts) < 5:
                          raise ValueError(f"Unsupported typos wheel: {name}")
                      version = parts[1]
                  elif name.endswith(".tar.gz"):
                      version = name[len("typos-") : -len(".tar.gz")]
                  elif name.endswith(".zip"):
                      version = name[len("typos-") : -len(".zip")]
                  else:
                      raise ValueError(f"Unsupported typos distribution: {name}")
                  match = stable.fullmatch(version)
                  if match:
                      candidates.append(((int(match[1]), int(match[2])), version))
                  elif not prerelease.fullmatch(version):
                      raise ValueError(f"Unsupported typos release format: {version}")
              if not candidates:
                  raise ValueError(f"No non-yanked stable typos {major}.x release on PyPI")
              return max(candidates)[1]

          def install_latest(python, version, run=subprocess.run):
              command = [str(python), "-m", "pip", "--isolated", "install", "--no-cache-dir", "--only-binary=:all:", "--index-url", "https://pypi.org/simple", f"typos=={version}"]
              try:
                  run(command, check=True)
              except subprocess.CalledProcessError as error:
                  print(f"::error::Cannot install latest typos {version} on this runner", file=sys.stderr)
                  return error.returncode or 1
              return 0

          if __name__ == "__main__":
              request = urllib.request.Request("https://pypi.org/simple/typos/", headers={"Accept": "application/vnd.pypi.simple.v1+json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  latest = latest_release(json.load(response)["files"], MAJOR)
              directory = Path(tempfile.mkdtemp(prefix="sciml-typos-", dir=os.environ["RUNNER_TEMP"]))
              venv.create(directory, with_pip=True)
              status = install_latest(directory / "bin" / "python", latest)
              if status:
                  sys.exit(status)
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"typos={directory / 'bin' / 'typos'}", file=output)
          PY

      - name: "Check spelling"
        shell: bash
        env:
          TYPOS: "${{ steps.install.outputs.typos }}"
        run: |
          set +e
          "$TYPOS" --format json | python3 -I -c '
          import json, sys

          def escape(value, property=False):
              value = str(value).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return value.replace(":", "%3A").replace(",", "%2C") if property else value

          for line in sys.stdin:
              item = json.loads(line)
              if item.get("type") != "typo":
                  continue
              path = item["path"]
              if path.startswith("./"):
                  path = path[2:]
              message = "\"" + item["typo"] + "\" should be \"" + "\" or \"".join(item.get("corrections") or []) + "\"."
              print("::warning file={},line={},col={}::{}".format(escape(path, True), item["line_num"], item["byte_offset"] + 1, escape(message)))
          '
          statuses=("${PIPESTATUS[@]}")
          set -e
          if (( statuses[1] != 0 )); then exit "${statuses[1]}"; fi
          if (( statuses[0] != 0 && statuses[0] != 2 )); then exit "${statuses[0]}"; fi
          "$TYPOS"

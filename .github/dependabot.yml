version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/.github/typos"
    schedule:
      interval: "weekly"
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

name: "CI (self-test)"

# CI for this repo's own contents: lint the reusable workflows (and the shell
# in their `run:` steps via shellcheck) and run the test suite for the
# sublibrary affected-set detection script. These workflows ship to ~all of
# SciML via `@v1`, so a regression here breaks every consumer on the next tag.

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  actionlint:
    name: "actionlint + shellcheck"
    # Pinned to a GitHub-hosted runner: this job pulls a docker:// image, which the
    # self-hosted pool (squats `ubuntu-latest`, no Docker) fails to pull. Self-hosted
    # runners do not carry the `ubuntu-24.04` label, so this forces GitHub-hosted.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The rhysd/actionlint image bundles shellcheck, so `run:` scripts in the
      # workflows are shellcheck-linted too.
      - name: "Lint workflows"
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: "-color"

  script-tests:
    name: "compute_affected_sublibraries.jl tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: "Run detection-script tests"
        run: julia --color=yes test/runtests.jl

  tagbot-resolver-tests:
    name: "monorepo TagBot resolver tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: "Run resolver tests"
        run: python3 -m unittest discover -s test -p 'test_resolve_monorepo_tagbot.py' -v

  workflow-group-tests:
    name: "Test group (${{ matrix.os }}, ${{ matrix.group-env-name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            group-env-name: GROUP
          - os: windows-latest
            group-env-name: GROUP
          - os: windows-latest
            group-env-name: SCIML_WORKFLOW_TEST_GROUP
    uses: ./.github/workflows/tests.yml
    with:
      julia-version: "1"
      os: ${{ matrix.os }}
      group: Core
      group-env-name: ${{ matrix.group-env-name }}
      project: test/fixtures/WorkflowGroupProbe
      num-threads: "1"
      buildpkg: false
      coverage: false
